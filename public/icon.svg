<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#1db954" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1ed760" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="4" />

  <!-- Spotify-Style Audio Waves (Green Glow) -->
  <g filter="url(#glow)">
    <!-- Top Arc -->
    <path d="M 130 185 C 210 145 320 145 390 190" fill="none" stroke="url(#greenGlow)" stroke-width="36" stroke-linecap="round" />
    <!-- Middle Arc -->
    <path d="M 155 255 C 225 220 310 220 365 255" fill="none" stroke="url(#greenGlow)" stroke-width="32" stroke-linecap="round" />
    <!-- Bottom Arc -->
    <path d="M 180 325 C 235 295 295 295 340 325" fill="none" stroke="url(#greenGlow)" stroke-width="28" stroke-linecap="round" />
  </g>

  <!-- Musical Note / Play Symbol Accent in corner -->
  <circle cx="360" cy="355" r="32" fill="#1ed760" />
  <polygon points="352,342 374,355 352,368" fill="#121212" />
</svg>
